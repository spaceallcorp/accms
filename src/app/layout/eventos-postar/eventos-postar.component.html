<div class="cms-form-wrapper">

  <div class="cms-form-header">
    <div class="cms-form-title-group">
      <span class="cms-form-icon-box" aria-hidden="true">
        <svg class="cms-title-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
      </span>
      <div>
        <h2 class="cms-form-title">Novo Evento</h2>
        <p class="cms-form-subtitle">Agendar evento na operação seleccionada</p>
      </div>
    </div>

    <div class="cms-op-destination-pill" title="Operação de destino activa">
      <img [src]="cmsSiteService.activeSiteConfig().logoSvg" [alt]="cmsSiteService.activeSiteConfig().name" class="cms-op-destination-logo" />
      <code class="cms-op-destination-code">{{ selectedCollection }}</code>
    </div>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="cms-alert cms-alert-error">
    <svg class="cms-btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="cms-alert cms-alert-success">
    <svg class="cms-btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    <span>{{ successMessage }}</span>
  </div>

  <div class="cms-form-body">
    <div class="cms-field-group">
      <label for="eventoTitleInput" class="cms-label">Nome do Evento <span class="cms-required">*</span></label>
      <input type="text" id="eventoTitleInput" [(ngModel)]="newEvento.title" class="cms-input" placeholder="Ex: Angola Cables Tech Summit" required />
    </div>

    <div class="cms-field-grid-2">
      <div class="cms-field-group">
        <label for="eventoAuthorInput" class="cms-label">Organização / Entidade</label>
        <input type="text" id="eventoAuthorInput" [(ngModel)]="newEvento.author" class="cms-input" placeholder="Entidade organizadora" />
      </div>

      <div class="cms-field-group">
        <label for="eventoUrlInput" class="cms-label">Link da Landing Page</label>
        <input type="url" id="eventoUrlInput" [(ngModel)]="eventoUrl" class="cms-input" placeholder="https://..." />
      </div>
    </div>

    <div class="cms-field-group">
      <label for="eventoImgInput" class="cms-label">Banner do Evento (URL da Imagem)</label>
      <input type="url" id="eventoImgInput" [(ngModel)]="featuredImageUrl" class="cms-input" placeholder="https://exemplo.com/banner-evento.jpg" />

      <div *ngIf="featuredImageUrl" class="cms-preview-box">
        <img [src]="featuredImageUrl" alt="Banner do evento" />
        <span style="font-size: 0.74rem; color: #475569; font-weight: 600;">Pré-visualização do banner</span>
      </div>
    </div>
  </div>

  <div class="cms-form-footer">
    <button type="button" class="cms-submit-btn" (click)="onSubmit()" [disabled]="isSubmitting">
      <svg class="cms-btn-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      <span>{{ isSubmitting ? 'A publicar...' : 'Publicar Evento' }}</span>
    </button>
  </div>

</div>
